[project]
name = "warden"
version = "0.9.0"
description = "An agentic Windows diagnostician that reads your machine, shows its evidence, and never runs anything you didn't approve."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psutil>=6.1",
    "httpx>=0.28",
    "pywebview>=5.3",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
sensors = ["pythonnet>=3.0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=6.1",
]
# Only needed to produce Warden.exe. Kept out of dev so that contributing to
# Warden does not mean installing a packaging toolchain.
build = ["pyinstaller>=6.11"]

[project.scripts]
warden = "warden.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "warden.contracts.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
